# the tests run in AGNOS's venv, it has everything but opendbc
[env]
PYTHONPATH = "/data/ci/tree:/data/ci/tree/panda/opendbc_repo"  # the tree is /data/ci/tree/panda, each job clones opendbc into it
PYTHONWARNINGS = "error"
LOGLEVEL = "debug"

[jobs.hitl]
runs-on = ["up-can", "up-tres-can"]
timeout-minutes = 20

[[jobs.hitl.steps]]
name = "Build"
run = """
git clone -q --depth 1 https://github.com/commaai/opendbc.git opendbc_repo
scons
scripts/reflash_internal_panda.py
"""

[[jobs.hitl.steps]]
name = "Test"
run = """
cd tests/hitl
HITL=1 python -m unittest discover -v
"""

# the test routes from the UP into the panda, its safety decisions must match libsafety's
[jobs.replay]
runs-on = "up-can"
timeout-minutes = 90
env = { REPLAY_SECONDS = "10" }

[[jobs.replay.steps]]
name = "Build"
run = """
git clone -q --depth 1 -b hw-replay https://github.com/commaai/opendbc.git opendbc_repo
scons
scripts/reflash_internal_panda.py
"""

[[jobs.replay.steps]]
name = "Replay"
run = "python opendbc_repo/opendbc/safety/tests/safety_replay/hw_replay.py"
