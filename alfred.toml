# the tests run in AGNOS's venv, it has everything but opendbc
before = [
  { name = "Fetch opendbc", run = """
d=/data/ci/opendbc
[ -d $d/.git ] || git clone -q --depth 1 https://github.com/commaai/opendbc.git $d
git -C $d fetch -q --depth 1 origin master && git -C $d reset -q --hard FETCH_HEAD && git -C $d clean -qffdx
git -C $d log --oneline -1""" },
  { name = "Build", run = "scons && cd scripts && ./reflash_internal_panda.py" },
]

[env]
PYTHONPATH = "/data/ci/tree:/data/ci/opendbc"  # the tree is /data/ci/tree/panda
PYTHONWARNINGS = "error"
LOGLEVEL = "debug"

[jobs.cuatro]
runs-on = "up-mici"
timeout-minutes = 20
steps = [{ name = "Test", run = "cd tests/hitl && HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" }]

[jobs.tres]
runs-on = "up-tres"
timeout-minutes = 20
steps = [{ name = "Test", run = "cd tests/hitl && HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" }]
