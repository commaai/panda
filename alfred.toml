profile = "tests/ci_profile.sh"
before = [
  # for the tests on the DUT, they reach it with UP.remote()
  { name = "Serve the UP's harness and CAN", on = "up", run = "up serve" },
  { name = "Install", run = """
uv=$(type -ap uv | grep -vF /usr/comma/shims | head -n1)  # not AGNOS's root-only uv shim
PYTHONWARNINGS=default "$uv" sync --cache-dir=/data/uv_cache --all-extras --upgrade-package opendbc
"$uv" cache prune --cache-dir=/data/uv_cache""" },
  { name = "Build", run = "scons && cd scripts && ./reflash_internal_panda.py" },
]

[env]
PYTHONWARNINGS = "error"
LOGLEVEL = "debug"
PYTEST_ADDOPTS = "-p no:asyncio"

[jobs.cuatro]
runs-on = "up-mici"
timeout-minutes = 20
steps = [{ name = "Test", run = "cd tests/hitl && PYTHONPATH=/data/ultimate_provisioning HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" }]

[jobs.tres]
runs-on = "up-tres"
timeout-minutes = 20
steps = [{ name = "Test", run = "cd tests/hitl && PYTHONPATH=/data/ultimate_provisioning HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" }]
