# the tests run in AGNOS's venv, it has everything but opendbc
[env]
PYTHONPATH = "/data/ci/tree:/data/ci/opendbc"  # the tree is /data/ci/tree/panda
PYTHONWARNINGS = "error"
LOGLEVEL = "debug"

[jobs.cuatro]
runs-on = "up-mici"
timeout-minutes = 20
steps = [
  { name = "Build", run = "rm -rf /data/ci/opendbc && git clone -q --depth 1 https://github.com/commaai/opendbc.git /data/ci/opendbc && scons && scripts/reflash_internal_panda.py" },
  { name = "Test", run = "cd tests/hitl && HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" },
]

[jobs.tres]
runs-on = "up-tres"
timeout-minutes = 20
steps = [
  { name = "Build", run = "rm -rf /data/ci/opendbc && git clone -q --depth 1 https://github.com/commaai/opendbc.git /data/ci/opendbc && scons && scripts/reflash_internal_panda.py" },
  { name = "Test", run = "cd tests/hitl && HITL=1 python -m unittest -v test_2*.py test_[5-9]*.py" },
]
