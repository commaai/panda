[project]
name = "pandacan"
version = "0.0.10"
description = "Code powering the comma.ai panda"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # macOS doesn't work with 3.13 due to pycapnp from opendbc
license = {text = "MIT"}
authors = [{name = "comma.ai"}]
classifiers = [
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "libusb1",
  "libusb-package",
  "opendbc @ git+https://github.com/commaai/opendbc.git@master#egg=opendbc",
  "spidev; platform_system == 'Linux'",  # runtime dependency on comma four
]

[project.optional-dependencies]
dev = [
  "scons",
  "cffi",
  "flaky",
  "pytest",
  "pytest-xdist",
  "pytest-mock",
  "pytest-timeout",
  "ruff",
  "setuptools",
  "comma-deps-gcc-arm-none-eabi ; python_full_version >= '3.12'",  # the wheels need 3.12
  "comma-deps-cppcheck ; python_full_version >= '3.12'",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "panda",
  "panda.python",
  "panda.board",
  "panda.board.body",
  "panda.board.jungle",
]

[tool.setuptools.package-data]
"panda.board" = ["health.h"]
"panda.board.jungle" = ["jungle_health.h"]

[tool.setuptools.package-dir]
panda = "."

# https://beta.ruff.rs/docs/configuration/#using-pyprojecttoml
[tool.ruff]
line-length = 160
target-version="py311"

[tool.ruff.lint]
select = ["E", "F", "W", "PIE", "C4", "ISC", "RUF100", "A"]
ignore = ["W292", "E741", "E402", "C408", "ISC003"]
flake8-implicit-str-concat.allow-multiline=false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.main".msg = "pytest.main requires special handling that is easy to mess up!"

[tool.pytest.ini_options]
addopts = "-Werror --strict-config --strict-markers --maxprocesses=8 -nauto --durations=10 --ignore-glob='*.sh' --ignore=tests/som --ignore=tests/hitl"
python_files = "test_*.py"
testpaths = [
  "tests/"
]

# --- TODO REMOVE AFTER DEPENDENCY PR MERGES (commaai/dependencies#107): fork-only index of the comma-deps Windows wheels until PyPI has them; not for upstream ---
[[tool.uv.index]]
name = "comma-deps-windows"
url = "https://github.com/AmyJeanes/commaai-dependencies/releases/download/windows-post111/index.html"
format = "flat"
explicit = true

[tool.uv.sources]
comma-deps-gcc-arm-none-eabi = [{ index = "comma-deps-windows", marker = "sys_platform == 'win32'" }]
comma-deps-cppcheck = [{ index = "comma-deps-windows", marker = "sys_platform == 'win32'" }]
